name: Build release (manual)

# Builds the Play Store bundle (.aab) and APKs. Start it by hand from the
# Actions tab when you want installable files. For a signed Play Store
# upload, add the secrets described in PLAYSTORE.md.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Signing key (optional)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          echo "$KEY_PROPERTIES" > android/key.properties
      - name: Build app bundle and APKs
        run: |
          flutter build appbundle --release
          flutter build apk --release --split-per-abi
      - name: Collect
        run: |
          mkdir -p out
          cp build/app/outputs/bundle/release/app-release.aab out/
          cp build/app/outputs/flutter-apk/*.apk out/
      - uses: actions/upload-artifact@v4
        with:
          name: formflow-release
          path: out/
      - name: Publish to the release-build branch
        run: bash tool/publish_branch.sh out release-build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
