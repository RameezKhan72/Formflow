name: formflow
description: FormFlow - AI form coach with real-time exercise form correction, 3D muscle demos and 56 exercises.
publish_to: 'none'
version: 2.0.0+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.0
  camera: '>=0.11.0 <1.0.0'
  google_mlkit_pose_detection: '>=0.12.0 <1.0.0'
  flutter_tts: '>=4.0.0 <5.0.0'
  wakelock_plus: '>=1.2.0 <2.0.0'
  share_plus: ^11.0.0
  video_player: '>=2.9.0 <3.0.0'
  google_mobile_ads: '>=6.0.0 <10.0.0'
  in_app_purchase: '>=3.2.0 <4.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/anatomy3d/
    - assets/exercise_video/
    - assets/thumbs/
    - assets/branding/
